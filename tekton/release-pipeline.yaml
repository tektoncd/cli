---
apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: cli-release-pipeline
spec:
  workspaces:
    - name: shared-workspace
  params:
    - name: url
      description: git url to clone
    - name: revision
      description: revision branch to checkout
    - name: package
      description: package to release
      default: github.com/tektoncd/cli
    - name: github-token-secret
      description: name of the secret holding the github-token
      default: bot-token-github
    - name: github-token-secret-key
      description: name of the key for the secret holding the github-token
      default: bot-token
    - name: golangci-lint-version
      description: version of the golangci-lint tool
    - name: go-version
      description: version of the go language
  tasks:
    - name: fetch-repository
      taskRef:
        name: git-clone
      workspaces:
        - name: output
          workspace: shared-workspace
      params:
        - name: url
          value: $(params.url)
        - name: revision
          value: $(params.revision)
        - name: deleteExisting
          value: "true"
    - name: get-versions
      runAfter: [fetch-repository]
      workspaces:
        - name: source
          workspace: shared-workspace
      params:
        - name: package
          value: $(params.package)
      taskRef:
        name: get-versions
    - name: lint
      runAfter: [get-versions]
      taskRef:
        name: golangci-lint
      params:
        - name: package
          value: $(params.package)
        - name: flags
          value: "-v --timeout 20m"
        - name: version
          value: $(params.golangci-lint-version)
      workspaces:
        - name: source
          workspace: shared-workspace
    - name: unit-tests
      runAfter: [lint]
      taskRef:
        name: golang-test
      params:
        - name: package
          value: $(params.package)
        - name: packages
          value: ./pkg/... ./cmd/...
        - name: version
          value: $(params.go-version)
        - name: flags
          value: -v -mod=vendor
      workspaces:
        - name: source
          workspace: shared-workspace
    - name: build
      runAfter: [lint]
      taskRef:
        name: golang-build
      params:
        - name: package
          value: $(params.package)
        - name: version
          value: $(params.go-version)
        - name: flags
          value: -v -mod=vendor
      workspaces:
        - name: source
          workspace: shared-workspace
    - name: release
      runAfter: [build, unit-tests]
      workspaces:
        - name: source
          workspace: shared-workspace
      params:
        - name: package
          value: $(params.package)
        - name: github-token-secret
          value: $(params.github-token-secret)
        - name: github-token-secret-key
          value: $(params.github-token-secret-key)
      taskSpec:
        params:
          - name: package
          - name: github-token-secret
          - name: github-token-secret-key
        workspaces:
          - name: source
        steps:
          - name: release-with-cosign
            image: goreleaser/goreleaser:v2.18.0
            workingDir: $(workspaces.source.path)
            env:
              - name: GITHUB_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: $(params.github-token-secret)
                    key: $(params.github-token-secret-key)
              - name: COSIGN_EXPERIMENTAL
                value: "1"
            script: |
              #!/bin/sh
              set -ex
              # Install cosign for keyless signing
              echo "Installing cosign..."
              wget -q -O /tmp/cosign https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64
              chmod +x /tmp/cosign
              mv /tmp/cosign /usr/local/bin/cosign
              cosign version
              # Run goreleaser with cosign available
              echo "Running goreleaser..."
              goreleaser release --clean --timeout=60m
